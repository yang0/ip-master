(groups[0].skill_name)}</a>`);for(const g of groups){const samples=byGroup[g.id];section.insertAdjacentHTML('beforeend',`<section class="group"><div class="group-head"><h3>${esc(g.title)}</h3><p>${esc(g.combine)}</p></div><div class="grid">${samples.map(card).join('')}</div></section>`);}section.insertAdjacentHTML('beforeend',`<details><summary>展开参数说明</summary><p>${esc(GUIDES[skill])}</p></details>`);catalog.append(section);}}const dialog=document.querySelector('#preview-dialog'),previewImage=document.querySelector('#preview-image'),previewTitle=document.querySelector('#preview-title'),previewSource=document.querySelector('#preview-source');document.querySelector('#preview-close').addEventListener('click',()=>dialog.close());catalog.addEventListener('click',e=>{const preview=e.target.closest('button[data-preview]');if(preview){const s=DATA.samples.find(x=>x.id===preview.dataset.preview);previewImage.src=s.image_url;previewImage.alt=s.skill_name+' · '+s.parameter_label+'参数 · '+s.sample_name;previewTitle.textContent=s.skill_name+' · '+s.parameter_label+'参数：'+s.sample_name;previewSource.href=s.source_url;dialog.showModal();return;}const b=e.target.closest('button[data-id]');if(!b)return;const s=DATA.samples.find(x=>x.id===b.dataset.id);copy(command(s));b.textContent='已复制参数调用方式';setTimeout(()=>b.textContent='采用这个'+s.parameter_label,1300);});const GUIDES={"baoyu-article-illustrator": "类型 type：infographic（信息图）、scene（场景）、flowchart（流程）、comparison（对比）、framework（框架）、timeline（时间线）。风格 style：决定画面语言；配色 palette：macaron（马卡龙）、warm（暖色）、neon（霓虹），留空则沿用风格默认色。", "baoyu-comic": "画风 art：ligne-claire（清线）、manga（日漫）、realistic（写实）、ink-brush（水墨）、chalk（粉笔）、minimalist（极简）。基调 tone：neutral（中性）、warm（温暖）、dramatic（戏剧）、romantic（浪漫）、energetic（活力）、vintage（复古）、action（动作）。分镜 layout：standard（标准）、cinematic（电影感）、dense（密集）、splash（大画幅）、mixed（混排）、webtoon（条漫）、four-panel（四格）。", "baoyu-cover-image": "封面类型 type：hero（主视觉）、conceptual（概念）、typography（文字主导）、metaphor（隐喻）、scene（场景）、minimal（极简）。媒介 rendering：flat（扁平）、watercolor（水彩）、editorial（编辑插画）、photo（摄影）、3d（三维）、paper-cut（纸雕）、clay（黏土）。比例 aspect：landscape（横版）、portrait（竖版）、square（方图）。", "baoyu-infographic": "布局 layout：决定信息关系，如 bridge（桥梁）、funnel（漏斗）、timeline-horizontal（横向时间线）、tree-hierarchy（树状层级）、venn（维恩图）。风格 style：决定视觉语言，如 craft-handmade（手作）、corporate-memphis（企业孟菲斯）、technical-schematic（技术示意）。比例 aspect：landscape（16:9 横版）、portrait（9:16 竖版）、square（1:1 方图）或自定义。", "baoyu-xhs-images": "风格 style：cute（可爱）、fresh（清新）、warm（温暖）、bold（大胆醒目）、minimal（极简）、retro（复古）、pop（流行）、notion（手绘笔记）、chalkboard（黑板）、study-notes（学习笔记）、screen-print（丝网印刷）、sketch-notes（手绘笔记）。布局 layout：sparse（留白少信息）、balanced（均衡）、dense（密集知识卡）、list（清单）、comparison（对比）、flow（步骤）、mindmap（思维导图）、quadrant（四象限）。配色 palette：macaron（马卡龙）、warm（暖色）、neon（霓虹）。", "baoyu-slide-deck": "风格 style：决定整套幻灯片的视觉系统。受众 audience：beginners（新手）、intermediate（有基础）、experts（专家）、executives（管理层）、general（通用）。页数 slide-count：建议 8–25 页，最多 30 页；内容越长，页数通常越多。"};search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase().replace(/\s+/g,'');let n=0;document.querySelectorAll('.sample').forEach(c=>{const yes=!q||c.dataset.search.replace(/\s+/g,'').includes(q);c.classList.toggle('hidden',!yes);if(yes)n++;});document.querySelectorAll('.group').forEach(g=>g.classList.toggle('hidden',!g.querySelector('.sample:not(.hidden)')));document.querySelectorAll('.skill').forEach(s=>s.classList.toggle('hidden',!s.querySelector('.group:not(.hidden)')));result.textContent=q?`匹配 ${n} 张；选择后复制参数调用方式`:'共 124 张官方参数示意图';});render();</script></body></html>
