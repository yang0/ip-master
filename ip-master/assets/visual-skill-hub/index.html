<!doctype html>
<script src="../github-title-link.js" defer></script>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IP Master · 视觉预览中心</title>
  <style>
    :root { color-scheme: dark; --bg:#111417; --panel:#181d22; --line:#303941; --text:#f2f5f6; --muted:#9ca8b2; --accent:#a8e36d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    .shell { min-height:100svh; display:grid; grid-template-columns:250px minmax(0,1fr); }
    aside { padding:22px 16px; border-right:1px solid var(--line); background:#13171b; }
    .brand { display:block; color:var(--text); text-decoration:none; font-size:17px; font-weight:700; letter-spacing:.02em; }
    .sub { margin:4px 0 24px; color:var(--muted); font-size:12px; }
    .jump { width:100%; padding:10px 11px; background:#20262c; color:var(--text); border:1px solid var(--line); border-radius:5px; outline:none; }
    .jump:focus { border-color:var(--accent); }
    .jump-note { min-height:18px; margin:7px 2px 16px; color:var(--muted); font-size:12px; }
    .nav { display:grid; gap:4px; }
    .tab { width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 11px; border:0; border-radius:5px; background:transparent; color:var(--muted); text-align:left; cursor:pointer; }
    .tab:hover, .tab.active { background:#222930; color:var(--text); }
    .tab.active { box-shadow:inset 2px 0 0 var(--accent); }
    .tab[disabled] { opacity:.42; cursor:not-allowed; }
    .count { color:#75818b; font-size:12px; white-space:nowrap; }
    .side-foot { position:absolute; bottom:22px; color:var(--muted); font-size:12px; }
    main { min-width:0; display:grid; grid-template-rows:auto minmax(0,1fr); }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:14px 20px; border-bottom:1px solid var(--line); }
    .title { min-width:0; }
    h1 { margin:0; font-size:16px; }
    .description { margin:2px 0 0; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .open { display:inline-flex; align-items:center; gap:6px; padding:8px 10px; border:1px solid var(--line); border-radius:5px; color:var(--text); background:#20262c; text-decoration:none; white-space:nowrap; }
    .open:hover { color:var(--accent); border-color:var(--accent); }
    .viewer { min-height:0; background:#0d1012; }
    iframe { width:100%; height:100%; min-height:calc(100svh - 68px); display:block; border:0; background:#0d1012; }
    .empty { height:100%; min-height:calc(100svh - 68px); display:grid; place-items:center; padding:24px; text-align:center; color:var(--muted); }
    .empty strong { color:var(--text); display:block; margin-bottom:7px; }
    @media (max-width:760px) {
      .shell { display:block; }
      aside { padding:14px; border-right:0; border-bottom:1px solid var(--line); }
      .sub, .jump-note { display:none; }
      .nav { display:flex; gap:6px; overflow:auto; margin-top:12px; padding-bottom:2px; }
      .tab { width:auto; flex:0 0 auto; border:1px solid var(--line); }
      .side-foot { display:none; }
      .toolbar { padding:12px 14px; }
      iframe, .empty { min-height:calc(100svh - 154px); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <a class="brand" href="../readme/index.html">IP Master</a>
      <p class="sub">视觉预览中心</p>
      <input id="jump" class="jump" placeholder="输入：041、布局 024、案例 495" autocomplete="off">
      <p id="jump-note" class="jump-note">输入后按回车切换图库</p>
      <nav id="nav" class="nav" aria-label="视觉 Skill 图库"></nav>
      <p class="side-foot">图库只供浏览；选择编号后再用于提示词。</p>
    </aside>
    <main>
      <header class="toolbar">
        <div class="title"><h1 id="title">视觉预览中心</h1><p id="description" class="description"></p></div>
        <a id="open" class="open" href="#" target="_blank" rel="noopener">新标签打开 ↗</a>
      </header>
      <section id="viewer" class="viewer"></section>
    </main>
  </div>
  <script>
    const projectUrl = new URLSearchParams(location.search).get('project');
    const sources = [
      { id:'roles', label:'项目角色库', count:'IP', src:projectUrl, description:'当前项目已登记的自定义 IP；复制角色调用后继续选择风格或布局。' },
      { id:'builtins', label:'预置角色', count:'4', src:'../built-in-character-library/index.html', description:'牙仔、绒宝、阿龅、小美四个全局可用角色；项目角色库不会重复展示它们。' },
      { id:'ip-as-logo', label:'IP as Logo', count:'IP 吉祥物', src:'../ip-as-logo-library/index.html', description:'极简圆润的 IP 吉祥物设计；先提 3 个方向，确认后生成 6 个候选。' },
      { id:'mono-color', label:'Mono Color', count:'单色 / 双色', src:'../mono-color-library/index.html', description:'README 驱动的编辑印刷 Skill；输入主题或照片后，由 Skill 自行选择墨色、版式与字体关系。' },
      { id:'punk', label:'Punk Skill', count:'PC01–31 / PA01–07', src:'../punk-skill-library/index.html', description:'31 种封面与 7 种头像风格；输入编号即可带入对应 style。' },
      { id:'handdraw', label:'手绘风格库', count:'261', src:'file:///C:/Users/yang0/.codex/skills/handdraw-style-prompter/handdraw-style-prompter/gallery/index.html', description:'输入 001–261 的手绘风格编号和主题，生成中英文提示词。' },
      { id:'layout', label:'350 布局库', count:'350', src:'../layout-library/index.html', description:'海报、封面和 PPT 的构图方法；只在明确给出编号时应用。' },
      { id:'gpt-image-2', label:'GPT-Image 2 案例库', count:'544', src:'../gpt-image-2-case-library/index.html', description:'筛选案例、查看原提示词，并复制案例编号。' },
      { id:'baoyu', label:'Baoyu 图册', count:'6', src:'../baoyu-skill-library/index.html', description:'六个视觉创作 Skill 的示例图与完整参数枚举。' },
      { id:'xiaohei', label:'小黑配图', count:'1.0 / 2.0', src:'../xiaohei-skill-library/index.html', description:'分别查看手绘正文解释图与真实物件场景图；两者都是最终配图方向。' },
      { id:'guizang', label:'归藏图册', count:'PPT / 社媒', src:'../guizang-skill-library/index.html', description:'归藏 PPT 与归藏社媒卡的官方效果、适用场景和最短调用方式。' },
      { id:'gbro', label:'狗哥图册', count:'10', src:'../gbro-skill-library/index.html', description:'固定 3:4 真人封面提示词 Skill；10 种构图风格和官方成片示例。' },
      { id:'vsc', label:'VSC 图册', count:'2', src:'../vsc-skill-library/index.html', description:'真实抓拍人像与情侣旅行 Vlog 的设计 Skill 示例。' },
      { id:'couple-photo', label:'Couple Photo 情侣照', count:'4 阶段', src:'../couple-photo-library/index.html', description:'需求确认、Couple Look、8 宫格拍摄、换装与精修工作流。' }
    ];
    const nav = document.querySelector('#nav');
    const viewer = document.querySelector('#viewer');
    const title = document.querySelector('#title');
    const description = document.querySelector('#description');
    const open = document.querySelector('#open');
    let activeId = projectUrl ? 'roles' : 'handdraw';
    function render() {
      const current = sources.find(item => item.id === activeId) || sources[1];
      nav.innerHTML = sources.map(item => `<button class="tab ${item.id === current.id ? 'active' : ''}" data-id="${item.id}" ${item.id === 'roles' && !item.src ? 'disabled title="请从项目角色库打开预览中心"' : ''}><span>${item.label}</span><span class="count">${item.count}</span></button>`).join('');
      title.textContent = current.label;
      description.textContent = current.description;
      open.href = current.src || '#';
      open.style.visibility = current.src ? 'visible' : 'hidden';
      viewer.innerHTML = current.src ? `<iframe title="${current.label}" src="${current.src}"></iframe>` : '<div class="empty"><div><strong>还没有连接项目角色库</strong>请从项目根目录的 <code>index.html</code> 点击“打开视觉预览中心”。</div></div>';
      nav.querySelectorAll('[data-id]').forEach(button => button.addEventListener('click', () => { activeId = button.dataset.id; render(); }));
    }
    document.querySelector('#jump').addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      const value = event.currentTarget.value.trim().toLowerCase();
      if (/^\d{1,3}$/.test(value) || value.includes('手绘') || value.includes('hand')) activeId = 'handdraw';
      else if (value.includes('布局') || value.includes('layout')) activeId = 'layout';
      else if (value.includes('案例') || value.includes('case') || value.includes('gpt')) activeId = 'gpt-image-2';
      else if (value.includes('宝玉') || value.includes('baoyu')) activeId = 'baoyu';
      else if (value.includes('小黑')) activeId = 'xiaohei';
      else if (value.includes('归藏') || value.includes('guizang') || value.includes('社媒卡')) activeId = 'guizang';
      else if (value.includes('狗哥') || value.includes('gbro')) activeId = 'gbro';
      else if (value.includes('couple photo') || value.includes('couple-photo') || value.includes('情侣照') || value.includes('婚纱照')) activeId = 'couple-photo';
      else if (value.includes('vsc') || value.includes('抓拍')) activeId = 'vsc';
      else if (value.includes('预置') || value.includes('牙仔') || value.includes('绒宝') || value.includes('阿龅') || value.includes('小美')) activeId = 'builtins';
      else if (value.includes('吉祥物') || value.includes('ip as logo') || value.includes('ip-as-logo')) activeId = 'ip-as-logo';
      else if (value.includes('单色') || value.includes('双色') || value.includes('mono')) activeId = 'mono-color';
      else if (value.includes('punk') || value.includes('朋克')) activeId = 'punk';
      else if (value.includes('角色') || value.includes('ip')) activeId = 'roles';
      render();
    });
    render();
  </script>
</body>
</html>
