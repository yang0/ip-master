<!doctype html>
<script src="../github-title-link.js" defer></script>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预置角色</title><style>
:root{color-scheme:dark;--bg:#101315;--panel:#181d21;--line:#303940;--text:#f2f5f6;--muted:#a2afb7;--accent:#a8e36d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1120px,calc(100% - 36px));margin:auto;padding:24px 0 40px}h1{font-size:20px;margin:0 0 4px}.note{margin:0 0 22px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.item{border:1px solid var(--line);background:var(--panel)}img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#252c31;padding:10px}.body{padding:12px}h2{font-size:16px;margin:0}p{color:var(--muted);margin:4px 0 11px}button{padding:7px 9px;background:#20272c;color:var(--text);border:1px solid #45515a;border-radius:4px;cursor:pointer}button:hover{border-color:var(--accent);color:var(--accent)}@media(max-width:760px){main{width:min(100% - 28px,1120px);padding-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main><h1>预置角色</h1><p class="note">全局可直接调用；它们不写入项目角色库。</p><section class="grid" id="grid"></section></main><script>const roles=[['牙仔','yazai','活力日常向 IP'],['绒宝','rongbao','温暖陪伴向 IP'],['阿龅','abao','直率趣味向 IP'],['小美','xiaomei','轻盈生活向 IP']];const grid=document.querySelector('#grid');grid.innerHTML=roles.map(([name,id,desc])=>`<article class="item"><img src="../characters/${id}.webp" alt="${name}"><div class="body"><h2>${name}</h2><p>${desc}</p><button data-copy="使用 IP：${name}，制作一张 [图片类型]，主题：[主题]。">复制调用</button></div></article>`).join('');grid.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='已复制'}catch{prompt('复制这句：',b.dataset.copy)}setTimeout(()=>b.textContent='复制调用',1200)})</script></body></html>
