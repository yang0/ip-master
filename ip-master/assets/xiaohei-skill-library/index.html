<!doctype html>
<script src="../github-title-link.js" defer></script>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小黑配图</title><style>
:root{color-scheme:dark;--bg:#101315;--panel:#181d21;--line:#303940;--text:#f2f5f6;--muted:#a2afb7;--accent:#a8e36d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1180px,calc(100% - 36px));margin:auto;padding:24px 0 44px}h1{font-size:20px;margin:0 0 4px}.intro,p{color:var(--muted)}.skill{margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}h2{font-size:17px;margin:0}.meta{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.meta p{margin:5px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}.sample{border:1px solid var(--line);background:var(--panel)}.preview{border:0;background:#252c31;padding:0;width:100%;cursor:zoom-in}.preview img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}.body{padding:11px}.body strong{display:block}.body p{margin:4px 0 10px}button,.link{padding:7px 9px;background:#20272c;color:var(--text);border:1px solid #45515a;border-radius:4px;cursor:pointer;text-decoration:none}.link:hover,button:hover{border-color:var(--accent);color:var(--accent)}dialog{width:min(1100px,94vw);border:1px solid var(--line);padding:0;background:#151a1e;color:var(--text)}dialog::backdrop{background:#000b}dialog img{width:100%;max-height:80vh;object-fit:contain;display:block;background:#111}.dialog-actions{padding:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}@media(max-width:760px){main{width:min(100% - 28px,1180px);padding-top:18px}.grid{grid-template-columns:1fr}}</style></head><body><main><h1>小黑配图</h1><p class="intro">图片直接来自已安装的小黑 Skill 官方示例。两套图都是最终正文配图方向，不是参数示意；先传入文章，再由 Skill 提炼适合配图的核心内容。</p><section class="skill"><div class="meta"><div><h2>小黑 1.0 · 怪诞手绘正文配图</h2><p>读取文章后，用黑色手绘、少量批注和留白解释其中的观点、流程、结构或方法。</p></div><button data-copy="使用 ian-xiaohei-illustrations，先读取并理解传入的文章；为其中的 [核心观点或段落] 设计一张 16:9 小黑手绘正文配图。">复制最短调用</button></div><div class="grid" id="one"></div></section><section class="skill"><div class="meta"><div><h2>小黑 2.0 · 真实物件场景图</h2><p>读取文章后，用小黑、真实物件和物理动作表达其中的处境；可做 16:9 正文图或超横版项目/成长长卷。</p></div><button data-copy="使用 ian-xiaohei-scenes，先读取并理解传入的文章；提炼 [处境或故事]，设计一张小黑实物场景图，规格：16:9 正文图。">复制最短调用</button></div><div class="grid" id="two"></div></section></main><dialog id="preview"><img><div class="dialog-actions"><a class="link" target="_blank" rel="noopener">打开本机原图</a><button>关闭</button></div></dialog><script>
const root='file:///C:/Users/yang0/.codex/skills/';
const samples={one:[['文章结构断点',root+'ian-xiaohei-illustrations/assets/examples/01-two-breakpoints.png'],['信任桥梁',root+'ian-xiaohei-illustrations/assets/examples/14-trust-bridge.png']],two:[['会议拉回 · 标准 16:9',root+'ian-xiaohei-scenes/assets/examples/01-meeting-pull-in.png'],['人生线 · 超横版长卷',root+'ian-xiaohei-scenes/assets/examples/07-long-scroll-story-master.png']]};
for(const [group,items] of Object.entries(samples)){document.querySelector('#'+group).innerHTML=items.map(([name,src])=>`<article class="sample"><button class="preview" data-src="${src}" data-name="${name}"><img loading="lazy" src="${src}" alt="${name}"></button><div class="body"><strong>${name}</strong><p>官方最终配图示例</p></div></article>`).join('')}
const dialog=document.querySelector('#preview'),image=dialog.querySelector('img'),source=dialog.querySelector('a');document.addEventListener('click',async e=>{const preview=e.target.closest('[data-src]');if(preview){image.src=preview.dataset.src;image.alt=preview.dataset.name;source.href=preview.dataset.src;dialog.showModal();return}const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);copy.textContent='已复制'}catch{prompt('复制这句：',copy.dataset.copy)}setTimeout(()=>copy.textContent='复制最短调用',1200)}});dialog.querySelector('button').addEventListener('click',()=>dialog.close())
</script></body></html>
