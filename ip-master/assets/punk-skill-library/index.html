<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punk Skill 风格图册</title>
<style>:root{color-scheme:dark;--bg:#111417;--panel:#1a2025;--line:#303940;--text:#f2f5f6;--muted:#a2adb5;--accent:#a8e36d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(1120px,calc(100% - 32px));margin:auto;padding:24px 0 48px}header{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}h1{font-size:20px;margin:0}h2{font-size:17px;margin:28px 0 5px}p{color:var(--muted);margin:6px 0}.link,button{border:1px solid var(--line);border-radius:5px;background:#20272c;color:var(--text);padding:8px 10px;text-decoration:none;cursor:pointer}.link:hover,button:hover{border-color:var(--accent);color:var(--accent)}.note{margin:18px 0;padding:12px 14px;border-left:2px solid var(--accent);background:#171c20}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--panel);overflow:hidden}.preview{display:block;width:100%;padding:0;border:0;border-radius:0;background:#f7f5ef}.preview img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}.body{padding:11px}.code{color:var(--accent);font:600 12px ui-monospace,monospace}.style{font:12px/1.35 ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.actions{margin-top:10px}dialog{border:1px solid var(--line);background:#151a1e;color:var(--text);max-width:min(940px,94vw);padding:16px}dialog img{display:block;max-width:88vw;max-height:75vh;object-fit:contain;background:#f7f5ef}dialog form{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:10px}@media(max-width:760px){main{width:min(100% - 24px,1120px);padding-top:16px}header{display:block}.link{display:inline-block;margin-top:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head>
<body><main><header><div><h1>Punk Skill · 封面与头像</h1><p>选择编号复制调用；所有图片均为上游风格示意，不是最终成片模板。</p></div><a class="link" href="https://github.com/adrianpunk/Punk-Skill" target="_blank" rel="noopener">GitHub ↗</a></header>
<div class="note"><strong>怎么使用</strong><p><code>PC01–PC31</code> 用于 <code>punk-cover</code>；<code>PA01–PA07</code> 用于 <code>punk-avatar</code>。可直接说“用 PC08 做封面”或点击按钮复制完整参数。图册图片只供浏览，绝不作为模型参考图输入。</p></div><h2>punk-cover · 31 种封面风格</h2><section class="grid" id="cover"></section><h2>punk-avatar · 7 种头像风格</h2><section class="grid" id="avatar"></section></main><dialog id="viewer"><img id="viewer-image" alt=""><form method="dialog"><span id="viewer-title"></span><button>关闭</button></form></dialog>

PC31|极简视觉隐喻风|minimal-visual-metaphor|minimal-visual-metaphor.png|商业科技、产品与系统变化`.split('\n').map(x=>x.split('|'));const A=`PA01|像素头像|pixel-avatar|pixel-avatar.png|人物、宠物、物件的通用头像
PA02|怪诞灵魂手绘|grotesque-soul-sketch|grotesque-soul-sketch.jpg|有性格的人物或宠物头像
